name: tests

on:
  pull_request:
    branches:
      - "12.0*"
  push:
    branches:
      - "12.0"
      - "12.0-ocabot-*"

jobs:
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # FIXME: .pots created by different runs are not identical. This
          # results in an endless loop. Because both macavrac_base and
          # polln_shift also depend on beesdoo_shift, they also generate a .pot
          # for shift.
          - container: ghcr.io/oca/oca-ci/py3.6-ocb12.0:latest
            include: "macavrac_base"
            name: test with OCB
            # makepot: "true"
          - container: ghcr.io/oca/oca-ci/py3.6-ocb12.0:latest
            include: "polln_shift"
            name: test with OCB
            # makepot: "true"
          - container: ghcr.io/oca/oca-ci/py3.6-ocb12.0:latest
            exclude: "macavrac_base,polln_shift"
            name: test with OCB
            makepot: "true"
    services:
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    env:
      INCLUDE: "${{ matrix.include }}"
      EXCLUDE: "${{ matrix.exclude }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test db
        run: oca_init_test_database
      # Fixes problem in https://github.com/beescoop/Obeesdoo/pull/297
      - name: Install beesdoo_shift
        run: odoo -d ${PGDATABASE} -i beesdoo_shift --stop-after-init
      - name: Run tests
        run: oca_run_tests
      - name: Upload screenshots from JS tests
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: Screenshots of failed JS tests - ${{ matrix.name }}${{ join(matrix.include) }}
          path: /tmp/odoo_tests/${{ env.PGDATABASE }}
          if-no-files-found: ignore
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'beescoop' }}
